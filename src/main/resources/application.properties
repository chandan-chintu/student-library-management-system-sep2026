spring.application.name=student-library-management-system

server.port=7777

# MySQL database properties
# The JDBC URL pointing to your MySQL server and database name
spring.datasource.url=jdbc:mysql://localhost:3306/student_library_sep2026

# MySQL database credentials
spring.datasource.username=root
spring.datasource.password=root1234

# Driver class (Optional for newer Spring Boot versions, as it auto-detects it)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# Spring Data JPA / Hibernate Settings
# =====================================================================
#  Hibernate DDL auto-generation (update, create, create-drop, validate, none)
spring.jpa.hibernate.ddl-auto=update

# Database platform dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Show SQL queries in the console log (useful for debugging)
spring.jpa.show-sql=true

